<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PA Agent 收益面板</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://unpkg.com/lightweight-charts@4.2.0/dist/lightweight-charts.standalone.production.js"></script>
<style>
:root {
  --bg: #0b0f17; --panel: #121826; --panel-2: #182033; --line: #243049;
  --text: #e6ebf5; --muted: #8a96ad; --accent: #4f8cff;
  --up: #22c55e; --down: #ef4444; --warn: #f59e0b;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text);
  font: 14px/1.5 -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; }
header { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between;
  padding: 14px 20px; border-bottom: 1px solid var(--line); position: sticky; top: 0; background: var(--bg); z-index: 5; }
h1 { font-size: 18px; margin: 0; }
.badges { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.badge { padding: 2px 10px; border-radius: 999px; font-size: 12px; border: 1px solid var(--line); color: var(--muted); }
.badge.demo { color: var(--accent); border-color: var(--accent); }
.badge.live { color: #fff; background: var(--down); border-color: var(--down); }
.badge.ok { color: var(--up); border-color: var(--up); }
.badge.bad { color: var(--down); border-color: var(--down); }
button { background: var(--panel-2); color: var(--text); border: 1px solid var(--line); border-radius: 8px;
  padding: 6px 12px; cursor: pointer; font: inherit; }
button.danger { background: var(--down); border-color: var(--down); color: #fff; }
button:hover { filter: brightness(1.15); }
select { background: var(--panel-2); color: var(--text); border: 1px solid var(--line); border-radius: 8px; padding: 5px 8px; font: inherit; }
main { padding: 16px 20px 40px; max-width: 1400px; margin: 0 auto; }
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin-bottom: 16px; }
.kpi { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; }
.kpi .label { color: var(--muted); font-size: 12px; }
.kpi .value { font-size: 22px; font-weight: 600; margin-top: 2px; font-variant-numeric: tabular-nums; }
.kpi .sub { color: var(--muted); font-size: 12px; }
.grid2 { display: grid; grid-template-columns: 2fr 1fr; gap: 16px; }
@media (max-width: 900px) { .grid2 { grid-template-columns: 1fr; } }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 14px; margin-bottom: 16px; min-width: 0; }
.card h2 { font-size: 15px; margin: 0 0 10px; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.chart-box { position: relative; height: 280px; }
.kline-box { position: relative; height: 420px; }
@media (max-width: 600px) { .kline-box { height: 320px; } }
input[type=text] { background: var(--panel-2); color: var(--text); border: 1px solid var(--line); border-radius: 8px;
  padding: 5px 8px; font: inherit; min-width: 0; }
.runner-form { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.runner-form input { flex: 1 1 260px; }
.runner-form button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.pager { display: flex; gap: 8px; align-items: center; justify-content: flex-end; flex-wrap: wrap;
  margin-top: 10px; color: var(--muted); font-size: 12px; }
.pager button { padding: 3px 10px; font-size: 12px; }
.pager button:disabled { opacity: .4; cursor: default; filter: none; }
.pager .new { color: var(--accent); cursor: pointer; margin-right: auto; }
.kline-ctl { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; font-weight: 400; }
.tabs { display: flex; gap: 6px; margin-bottom: 10px; flex-wrap: wrap; }
.tabs button.active { background: var(--accent); border-color: var(--accent); }
.table-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
th, td { text-align: left; padding: 7px 8px; border-bottom: 1px solid var(--line); white-space: nowrap; }
th { color: var(--muted); font-weight: 500; font-size: 12px; }
tbody tr.clickable { cursor: pointer; }
tbody tr.clickable:hover { background: var(--panel-2); }
.up { color: var(--up); } .down { color: var(--down); } .muted { color: var(--muted); }
.empty { color: var(--muted); padding: 16px; text-align: center; }
.drawer { position: fixed; inset: 0; background: rgba(0,0,0,.55); display: none; z-index: 20; }
.drawer.open { display: block; }
.drawer .sheet { position: absolute; right: 0; top: 0; bottom: 0; width: min(720px, 100%); background: var(--panel);
  border-left: 1px solid var(--line); overflow-y: auto; padding: 18px; }
.drawer img { width: 100%; border-radius: 8px; border: 1px solid var(--line); margin: 8px 0; }
.kv { display: grid; grid-template-columns: 110px 1fr; gap: 4px 10px; margin: 8px 0 14px; }
.kv div:nth-child(odd) { color: var(--muted); }
.reason { background: var(--panel-2); border-radius: 8px; padding: 10px 12px; white-space: pre-wrap; margin: 6px 0 12px; }
ul.list { margin: 4px 0 12px; padding-left: 18px; }
.events li { margin: 2px 0; }
.hint { color: var(--muted); font-size: 12px; }
label.ctl { display: inline-flex; gap: 6px; align-items: center; color: var(--muted); font-size: 12px; }
label.chk { display: inline-flex; gap: 4px; align-items: center; color: var(--muted); font-size: 12px; cursor: pointer; }
.notice { display: none; border: 1px solid var(--warn); color: var(--warn); background: rgba(245,158,11,.08);
  border-radius: 10px; padding: 8px 12px; margin: -4px 0 16px; font-size: 13px; }
.notice.show { display: block; }
</style>
</head>
<body>
<header>
  <h1>PA Agent 收益面板</h1>
  <div class="badges">
    <span id="mode" class="badge">—</span>
    <span id="hb" class="badge">执行器 —</span>
    <label class="ctl">策略版本 <select id="version"><option value="">全部版本</option></select></label>
    <label class="ctl">统计区间 <select id="range">
      <option value="0">全部</option><option value="1">近 1 天</option>
      <option value="7">近 7 天</option><option value="30">近 30 天</option>
    </select></label>
    <button id="killBtn" class="danger">紧急停止</button>
  </div>
</header>
<main>
  <section class="kpis" id="kpis"></section>

  <div class="notice" id="notice"></div>

  <div class="card">
    <h2>K线 <span class="kline-ctl"><span class="hint" id="klineInfo"></span>
      <label class="chk"><input type="checkbox" id="klineCanceled">显示已撤销挂单</label>
      <select id="klineInst"></select>
      <select id="klineTf">
        <option value="1m">1m</option><option value="3m">3m</option><option value="5m">5m</option><option value="15m">15m</option><option value="30m">30m</option><option value="1h">1h</option><option value="2h">2h</option><option value="4h">4h</option><option value="1d">1d</option><option value="1w">1w</option>
      </select></span></h2>
    <div class="kline-box" id="kline"></div>
  </div>

  <div class="grid2">
    <div class="card">
      <h2>账户权益曲线 (USDT) <span class="hint">账户整体，含持仓浮动盈亏</span></h2>
      <div class="chart-box"><canvas id="eqChart"></canvas></div>
    </div>
    <div class="card">
      <h2>当前持仓 / 挂单</h2>
      <div class="table-wrap"><table id="activeTbl"></table></div>
    </div>
  </div>

  <div class="card">
    <h2>累计 R <span class="hint">每个点是一笔平仓交易，按平仓顺序；1R = 该笔计划风险</span></h2>
    <div class="chart-box"><canvas id="pnlChart"></canvas></div>
  </div>

  <div class="card">
    <h2>交易明细 <span class="kline-ctl"><span class="hint">点击一行查看 AI 当时的分析</span>
      <select id="tradeState">
        <option value="pending,open,closed">已成交 + 挂单中</option>
        <option value="">全部（含已撤销）</option>
        <option value="canceled,rejected,error">已撤销 / 拒绝</option>
      </select>
      <select class="instFilter"></select></span></h2>
    <div class="table-wrap"><table id="tradesTbl"></table></div>
    <div class="pager" id="tradesPager"></div>
  </div>

  <div class="card">
    <h2>AI 质量分析 <span class="hint">AI 自己说的把握度 / 胜率，和实际结果对比</span></h2>
    <div class="tabs" id="qTabs"></div>
    <div class="table-wrap"><table id="qTbl"></table></div>
    <p class="hint" id="funnel"></p>
  </div>

  <div class="card">
    <h2>信号记录 <span class="kline-ctl"><span class="hint">每次分析的结论，以及执行器怎么处理的</span>
      <label class="chk"><input type="checkbox" id="sigOrdersOnly" checked>只看下单信号</label>
      <select class="instFilter"></select></span></h2>
    <div class="table-wrap"><table id="sigTbl"></table></div>
    <div class="pager" id="sigPager"></div>
  </div>

  <div class="card">
    <h2>系统事件</h2>
    <div class="table-wrap"><table id="evTbl"></table></div>
    <div class="pager" id="evPager"></div>
  </div>

  <div class="card">
    <h2>分析设置 <span class="hint">后台 AI 分析、交易的品种和K线周期，保存后下一轮生效，无需重启</span></h2>
    <div class="runner-form">
      <input type="text" id="runSymbols" placeholder="品种，逗号分隔，如 BTC-USDT-SWAP, ETH-USDT-SWAP（也可只写 BTC）">
      <select id="runTf"></select>
      <button id="runSave" class="primary">保存</button>
    </div>
    <p class="hint" id="runStatus" style="margin:8px 0 0"></p>
  </div>
</main>

<div class="drawer" id="drawer"><div class="sheet" id="sheet"></div></div>

<script>
const TOKEN = new URLSearchParams(location.search).get("token") || "";
const api = async (path, opts = {}) => {
  const headers = TOKEN ? { Authorization: "Bearer " + TOKEN } : {};
  const r = await fetch(path, { ...opts, headers });
  if (!r.ok) throw new Error(r.status + " " + path);
  return r.json();
};
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const num = (v, d = 2) => v == null ? "—" : Number(v).toLocaleString("en-US", { minimumFractionDigits: d, maximumFractionDigits: d });
const pct = (v, d = 1) => v == null ? "—" : num(v, d) + "%";
const signed = (v, d = 2) => v == null ? "—" : `<span class="${v > 0 ? "up" : v < 0 ? "down" : ""}">${v > 0 ? "+" : ""}${num(v, d)}</span>`;
const ts = (ms) => ms ? new Date(ms).toLocaleString("zh-CN", { hour12: false, month: "2-digit", day: "2-digit", hour: "2-digit", minute: "2-digit" }) : "—";
const dirLabel = (d) => d === "long" ? '<span class="up">做多</span>' : d === "short" ? '<span class="down">做空</span>' : "—";
const entryLabel = { limit: "限价", stop: "突破", market: "市价", none: "不下单" };
const stateLabel = { pending: "挂单中", open: "持仓中", closed: "已平仓", canceled: "已撤销", rejected: "已拒绝", error: "错误" };
const sigStatus = { new: "待处理", processed: "已下单", rejected: "风控拒绝", skipped: "跳过", error: "错误" };
const sigHandled = (r) => r.order_type === "none" ? '<span class="muted">无操作</span>' : (sigStatus[r.status] || r.status);
const short = (inst) => String(inst || "").replace("-SWAP", "");
const MIN_SAMPLE = 30;
const store = {  // per-viewer UI prefs; storage may be unavailable
  get(k, d) { try { const v = localStorage.getItem("pa." + k); return v == null ? d : v; } catch { return d; } },
  set(k, v) { try { localStorage.setItem("pa." + k, v); } catch {} },
};
// query string for the statistics filters (version + period)
const statQs = () => `days=${$("range").value}&version=${encodeURIComponent($("version").value)}`;
const rFmt = (v) => v == null ? "—" : signed(v, 2) + "R";
const usdt = (contracts, ctVal, price) => contracts && ctVal && price ? num(contracts * ctVal * price, 0) : "—";
const posU = (r) => usdt(r.filled_contracts || r.contracts, r.ct_val, r.avg_entry || r.planned_entry);
const css = (v) => getComputedStyle(document.documentElement).getPropertyValue(v).trim();

let pts = [];
let eqChart, pnlChart, qData, qKey = "by_version", versions = [];

function kpi(label, value, sub = "") {
  return `<div class="kpi"><div class="label">${label}</div><div class="value">${value}</div><div class="sub">${sub}</div></div>`;
}

function table(el, cols, rows, onClick) {
  if (!rows.length) { el.innerHTML = `<tr><td class="empty">暂无数据</td></tr>`; return; }
  el.innerHTML = `<thead><tr>${cols.map((c) => `<th>${c[0]}</th>`).join("")}</tr></thead><tbody>` +
    rows.map((r, i) => `<tr data-i="${i}" class="${onClick ? "clickable" : ""}">${cols.map((c) => `<td>${c[1](r)}</td>`).join("")}</tr>`).join("") + "</tbody>";
  if (onClick) el.querySelectorAll("tbody tr").forEach((tr) => tr.onclick = () => onClick(rows[+tr.dataset.i]));
}

function lineChart(existing, canvas, labels, data, color) {
  const cfg = {
    type: "line",
    data: { labels, datasets: [{ data, borderColor: color, backgroundColor: color + "22", fill: true, pointRadius: 0, tension: .15, borderWidth: 2 }] },
    options: { maintainAspectRatio: false, animation: false, plugins: { legend: { display: false } },
      scales: { x: { ticks: { color: css("--muted"), maxTicksLimit: 8 }, grid: { color: css("--line") } },
                y: { ticks: { color: css("--muted") }, grid: { color: css("--line") } } } },
  };
  if (existing) { existing.data = cfg.data; existing.update(); return existing; }
  return new Chart(canvas, cfg);
}

async function loadOverview() {
  const o = await api(`/api/overview?${statQs()}`);
  const s = o.summary;
  $("mode").className = "badge " + (o.demo ? "demo" : "live");
  $("mode").textContent = o.demo ? "模拟盘" : "实盘";
  const age = o.heartbeat_ms ? (Date.now() - o.heartbeat_ms) / 1000 : null;
  $("hb").className = "badge " + (age != null && age < 30 ? "ok" : "bad");
  $("hb").textContent = age == null ? "执行器未运行" : age < 30 ? "执行器运行中" : `执行器 ${Math.round(age)} 秒无心跳`;
  $("killBtn").textContent = o.kill_switch ? "解除紧急停止" : "紧急停止";
  $("killBtn").className = o.kill_switch ? "" : "danger";
  $("killBtn").dataset.on = o.kill_switch ? "1" : "0";
  const eq = o.equity;
  const ver = $("version").value;
  $("kpis").innerHTML = [
    kpi("账户权益 (USDT)", eq ? num(eq.total_eq) : "—", eq ? `账户整体 · 可用 ${num(eq.avail_eq)} · 浮动 ${num(eq.upl)}` : ""),
    kpi("净盈亏 (USDT)", signed(s.net_pnl), s.return_pct != null ? `收益率 ${pct(s.return_pct, 2)}（相对首笔开仓前权益）` : ""),
    kpi("胜率", pct(s.win_rate), `${s.wins} 盈 / ${s.losses} 亏，共 ${s.trades} 笔`),
    kpi("平均 R", s.avg_r == null ? "—" : signed(s.avg_r), `合计 ${rFmt(s.total_r)} · 每笔 ${num(s.expectancy)} USDT`),
    kpi("平均盈 / 平均亏", num(s.payoff_ratio), `利润因子 ${num(s.profit_factor)}`),
    kpi("最大回撤（已实现）", num(s.max_drawdown), `${s.max_drawdown_pct != null ? pct(s.max_drawdown_pct, 2) + " · " : ""}${num(s.max_drawdown_r)}R`),
    kpi("手续费 (USDT)", num(s.fees), `资金费 ${num(s.funding)}（均已计入净盈亏）`),
  ].join("");
  const notes = [];
  if (s.trades < MIN_SAMPLE)
    notes.push(`样本不足：当前只有 ${s.trades} 笔已平仓交易，少于 ${MIN_SAMPLE} 笔时胜率、平均 R 波动很大，仅供参考。`);
  const mixed = versions.filter((v) => v.closed > 0).length;
  if (!ver && mixed > 1)
    notes.push(`统计混合了 ${mixed} 个策略版本，评估策略请在右上角选择单一版本。`);
  $("notice").innerHTML = notes.map(esc).join("<br>");
  $("notice").classList.toggle("show", notes.length > 0);
  table($("activeTbl"), [
    ["#", (r) => r.id], ["品种", (r) => esc(short(r.inst_id))], ["方向", (r) => dirLabel(r.direction)],
    ["状态", (r) => stateLabel[r.state] + (r.state === "pending" ? "·" + entryLabel[r.entry_type] : "")],
    ["仓位 (USDT)", posU],
    ["入场", (r) => num(r.avg_entry || r.planned_entry, 1)], ["止损", (r) => num(r.stop_loss, 1)],
    ["止盈", (r) => num(r.tp1, 1) + (r.tp2 ? " / " + num(r.tp2, 1) : "")],
  ], o.active, (r) => openTrade(r.id));
}

// Default to the current version (and follow it when a new one appears) until
// the viewer picks one themselves in this page session.
let versionPicked = false;
async function loadVersions() {
  versions = await api("/api/versions");
  const current = versions.find((v) => v.current);
  const sel = $("version"), want = versionPicked ? sel.value : (current ? current.key : "");
  const opts = [["", "全部版本"], ...versions.map((v) =>
    [v.key, `${v.label}${v.current ? "（当前）" : ""} · ${v.closed} 笔`])];
  const html = opts.map(([k, l]) => `<option value="${esc(k)}">${esc(l)}</option>`).join("");
  if (sel.innerHTML !== html) sel.innerHTML = html;
  sel.value = opts.some(([k]) => k === want) ? want : "";
}

async function loadEquity() {
  const rows = await api(`/api/equity?days=${$("range").value}`);
  eqChart = lineChart(eqChart, $("eqChart"), rows.map((r) => ts(r.ts_ms)), rows.map((r) => r.total_eq), css("--accent"));
}

// ── 分页：第 1 页随自动刷新显示最新；翻到后面时锁定位置，新记录只提示不打乱 ──
const PAGE_SIZE = 30;
let instFilter = "";
const pagers = {};

async function apiPaged(path) {
  const headers = TOKEN ? { Authorization: "Bearer " + TOKEN } : {};
  const r = await fetch(path, { headers });
  if (!r.ok) throw new Error(r.status + " " + path);
  return { rows: await r.json(), total: +(r.headers.get("X-Total-Count") || 0) };
}

function pager(key, el, reload) {
  return pagers[key] ||= { page: 1, total: 0, anchor: null, el, reload };
}

// anchor = 离开第 1 页时的总数；之后新增的记录会让偏移量相应后移
async function fetchPage(p, path) {
  const sep = path.includes("?") ? "&" : "?";
  let shift = p.anchor == null ? 0 : p.total - p.anchor;
  for (let i = 0; i < 2; i++) {
    const res = await apiPaged(`${path}${sep}limit=${PAGE_SIZE}&offset=${(p.page - 1) * PAGE_SIZE + shift}`);
    p.total = res.total;
    const actual = p.anchor == null ? 0 : p.total - p.anchor;
    if (actual === shift) return res.rows;
    shift = actual;
  }
  return (await apiPaged(`${path}${sep}limit=${PAGE_SIZE}&offset=${(p.page - 1) * PAGE_SIZE + shift}`)).rows;
}

function renderPager(p) {
  const base = p.anchor ?? p.total;
  const pages = Math.max(1, Math.ceil(base / PAGE_SIZE));
  const fresh = p.anchor == null ? 0 : p.total - p.anchor;
  p.el.innerHTML = (fresh > 0 ? `<span class="new" data-go="1">有 ${fresh} 条新记录，回到第 1 页查看</span>` : "") +
    `<span>共 ${p.total} 条 · 第 ${p.page} / ${pages} 页</span>` +
    `<button data-go="${p.page - 1}" ${p.page <= 1 ? "disabled" : ""}>上一页</button>` +
    `<button data-go="${p.page + 1}" ${p.page >= pages ? "disabled" : ""}>下一页</button>`;
  p.el.querySelectorAll("[data-go]").forEach((b) => b.onclick = () => {
    const go = +b.dataset.go;
    if (go < 1 || go > pages) return;
    if (go === 1) p.anchor = null;
    else if (p.anchor == null) p.anchor = p.total;
    p.page = go;
    p.reload().catch(() => {});
  });
}

function resetPager(key) { if (pagers[key]) Object.assign(pagers[key], { page: 1, anchor: null }); }

async function loadInstFilter() {
  const list = await api("/api/instruments");
  document.querySelectorAll(".instFilter").forEach((sel) => {
    const want = ["", ...list];
    if (sel.options.length === want.length && [...sel.options].every((o, i) => o.value === want[i])) return;
    sel.innerHTML = `<option value="">全部品种</option>` +
      list.map((i) => `<option value="${esc(i)}">${esc(i.replace("-SWAP", ""))}</option>`).join("");
    sel.value = want.includes(instFilter) ? instFilter : "";
  });
}
document.querySelectorAll(".instFilter").forEach((sel) => sel.onchange = () => {
  instFilter = sel.value;
  document.querySelectorAll(".instFilter").forEach((o) => { o.value = instFilter; });
  resetPager("trades"); resetPager("sig");
  loadTrades().catch(() => {}); loadSignals().catch(() => {});
});

async function loadPnlChart() {
  const closed = (await api(`/api/trades?state=closed&limit=2000&${statQs()}`))
    .filter((r) => r.net_pnl != null && r.risk_amount).sort((a, b) => a.closed_ms - b.closed_ms);
  let acc = 0;
  pts = closed.map((r) => { const R = r.net_pnl / r.risk_amount; acc += R; return { r, R, acc }; });
  const data = { labels: pts.map((p) => "#" + p.r.id), datasets: [{
    data: pts.map((p) => p.acc), borderColor: css("--accent"), backgroundColor: css("--accent") + "22", fill: true,
    tension: 0, borderWidth: 2, pointRadius: 4, pointHoverRadius: 6,
    pointBackgroundColor: pts.map((p) => p.R > 0 ? css("--up") : css("--down")), pointBorderWidth: 0 }] };
  if (pnlChart) { pnlChart.data = data; pnlChart.update(); return; }
  pnlChart = new Chart($("pnlChart"), { type: "line", data, options: {
    maintainAspectRatio: false, animation: false, plugins: { legend: { display: false }, tooltip: { callbacks: {
      label: (c) => { const p = pts[c.dataIndex]; return [`本笔 ${p.R > 0 ? "+" : ""}${p.R.toFixed(2)}R（${num(p.r.net_pnl)} USDT）`, `累计 ${p.acc.toFixed(2)}R`]; },
    } } },
    scales: { x: { ticks: { color: css("--muted"), maxTicksLimit: 12 }, grid: { color: css("--line") } },
              y: { ticks: { color: css("--muted"), callback: (v) => v + "R" }, grid: { color: css("--line") } } } } });
}

async function loadTrades() {
  const p = pager("trades", $("tradesPager"), loadTrades);
  const q = new URLSearchParams();
  if (instFilter) q.set("inst_id", instFilter);
  if ($("tradeState").value) q.set("state", $("tradeState").value);
  if ($("version").value) q.set("version", $("version").value);
  const rows = await fetchPage(p, `/api/trades${q.toString() ? "?" + q : ""}`);
  renderPager(p);
  const filled = (r) => r.state === "open" || r.state === "closed";
  table($("tradesTbl"), [
    ["#", (r) => r.id],
    ["时间", (r) => r.opened_ms ? ts(r.opened_ms) + " 成交" : `<span class="muted">${ts(r.created_ms)} 下单</span>`],
    ["品种", (r) => esc(short(r.inst_id))],
    ["方向 · 方式", (r) => `${dirLabel(r.direction)} · ${entryLabel[r.entry_type] || r.entry_type}`],
    ["状态", (r) => stateLabel[r.state] || r.state],
    ["仓位 (USDT)", (r) => filled(r) ? posU(r) : `<span class="muted">计划 ${posU(r)}</span>`],
    ["入场", (r) => num(r.avg_entry || r.planned_entry, 1)],
    ["止损", (r) => num(r.stop_loss, 1)],
    ["止盈 1 / 2", (r) => num(r.tp1, 1) + (r.tp2 ? " / " + num(r.tp2, 1) : "")],
    ["出场", (r) => num(r.avg_exit, 1)],
    ["计划风险 (USDT)", (r) => num(r.risk_amount, 0)],
    ["净盈亏 (USDT)", (r) => signed(r.net_pnl)],
    ["R", (r) => r.net_pnl != null && r.risk_amount ? rFmt(r.net_pnl / r.risk_amount) : "—"],
    ["AI把握度", (r) => r.trade_confidence ?? "—"],
    ["离场 / 撤单原因", (r) => esc(r.close_reason)],
  ], rows, (r) => openTrade(r.id));
}

const qTabsDef = [["by_version", "按策略版本"], ["by_confidence", "按交易把握度"], ["by_estimated_win_rate", "按 AI 估计胜率"], ["by_entry_type", "按入场方式"],
  ["by_direction", "按方向"], ["by_cycle", "按市场周期"], ["by_exit_reason", "按离场原因"]];
function renderQuality() {
  $("qTabs").innerHTML = qTabsDef.map(([k, l]) => `<button data-k="${k}" class="${k === qKey ? "active" : ""}">${l}</button>`).join("");
  $("qTabs").querySelectorAll("button").forEach((b) => b.onclick = () => { qKey = b.dataset.k; renderQuality(); });
  table($("qTbl"), [["分组", (g) => esc(g.group)],
    ["笔数", (g) => g.trades < MIN_SAMPLE ? `${g.trades} <span class="hint">样本少</span>` : g.trades],
    ["实际胜率", (g) => pct(g.win_rate)], ["平均 R", (g) => rFmt(g.avg_r)], ["合计 R", (g) => rFmt(g.total_r)],
    ["净盈亏 (USDT)", (g) => signed(g.net_pnl)]], qData[qKey] || []);
  const f = qData.signal_funnel || {};
  $("funnel").textContent = `统计区间内共分析 ${qData.signals_total} 次，其中下单信号 ${qData.signals_actionable} 条` +
    (Object.keys(f).length ? "：" + Object.entries(f).map(([k, v]) => `${sigStatus[k] || k} ${v}`).join("，") : "") +
    "。只统计已平仓交易。";
}
async function loadQuality() { qData = await api(`/api/ai-quality?${statQs()}`); renderQuality(); }

async function loadSignals() {
  const p = pager("sig", $("sigPager"), loadSignals);
  const q = new URLSearchParams();
  if (instFilter) q.set("symbol", instFilter);
  if ($("sigOrdersOnly").checked) q.set("actionable", "true");
  if ($("version").value) q.set("version", $("version").value);
  const rows = await fetchPage(p, `/api/signals${q.toString() ? "?" + q : ""}`);
  renderPager(p);
  table($("sigTbl"), [
    ["#", (r) => r.id], ["时间", (r) => ts(r.created_ms)], ["品种", (r) => esc(short(r.symbol))],
    ["周期", (r) => esc(r.timeframe)], ["结论", (r) => r.order_type === "none" ? '<span class="muted">不下单</span>' : dirLabel(r.direction) + " " + entryLabel[r.order_type]],
    ["入场 / 止损 / 止盈", (r) => r.order_type === "none" ? "—" : `${num(r.entry, 1)} / ${num(r.stop_loss, 1)} / ${num(r.tp1, 1)}`],
    ["把握度", (r) => r.trade_confidence ?? "—"], ["处理", sigHandled],
    ["说明", (r) => r.order_type === "none" && r.status_reason === "不下单" ? "—" : esc(r.status_reason)],

async function loadEvents() {
  const p = pager("ev", $("evPager"), loadEvents);
  const rows = await fetchPage(p, "/api/events");
  renderPager(p);
  table($("evTbl"), [["时间", (r) => ts(r.ts_ms)], ["交易", (r) => r.trade_id ?? "—"],
    ["级别", (r) => `<span class="${r.level === "error" ? "down" : r.level === "warn" ? "" : "muted"}" style="${r.level === "warn" ? "color:var(--warn)" : ""}">${r.level}</span>`],
    ["类型", (r) => esc(r.kind)], ["内容", (r) => `<span style="white-space:normal">${esc(r.message)}</span>`]], rows);

function list(items) {
  if (!Array.isArray(items) || !items.length) return "";
  return `<ul class="list">${items.map((x) => `<li>${esc(typeof x === "string" ? x : JSON.stringify(x))}</li>`).join("")}</ul>`;
}

function signalSection(sig) {
  if (!sig) return "<p class='muted'>没有关联的信号</p>";
  const d = (sig.decision && sig.decision.decision) || {};
  const diag = (sig.decision && sig.decision.diagnosis_summary) || {};
  const img = sig.chart_image ? `<img src="/api/chart/${sig.id}${TOKEN ? "?token=" + encodeURIComponent(TOKEN) : ""}" alt="K线图" onerror="this.remove()">` : "";
  return `
    <h3>AI 分析（信号 #${sig.id}，${ts(sig.created_ms)}，${esc(sig.source)}）</h3>${img}
    <div class="kv">
      <div>结论</div><div>${esc(d.order_direction || "—")} ${esc(d.order_type || "")}</div>
      <div>市场周期</div><div>${esc(sig.stage1?.cycle_position || diag.cycle_position || "—")} · ${esc(sig.stage1?.direction || diag.direction || "")}</div>
      <div>诊断把握度</div><div>${esc(d.diagnosis_confidence ?? "—")}</div>
      <div>交易把握度</div><div>${esc(d.trade_confidence ?? "—")}</div>
      <div>估计胜率</div><div>${esc(d.estimated_win_rate ?? "—")}</div>
      <div>策略版本</div><div>${esc(sig.model || "未标记")} · ${esc(sig.prompt_hash || "—")}</div>
      <div>执行器处理</div><div>${sigHandled(sig)} ${esc(sig.status_reason)}</div>
    </div>
    <div class="muted">理由</div><div class="reason">${esc(d.reasoning || sig.reasoning || "—")}</div>
    ${d.key_factors ? `<div class="muted">关键因素</div>${list(d.key_factors)}` : ""}
    ${d.watch_points ? `<div class="muted">观察要点</div>${list(d.watch_points)}` : ""}
    ${d.risk_assessment ? `<div class="muted">风险评估</div><div class="reason">${esc(d.risk_assessment)}</div>` : ""}
    ${d.invalidation_condition ? `<div class="muted">失效条件</div><div class="reason">${esc(d.invalidation_condition)}</div>` : ""}`;
}

async function openTrade(id) {

  $("sheet").innerHTML = `
    <h2 style="display:flex;justify-content:space-between">交易 #${t.id} <button onclick="closeDrawer()">关闭</button></h2>
    <div class="kv">
      <div>品种</div><div>${esc(t.inst_id)} · ${esc(t.timeframe)} · ${t.demo ? "模拟盘" : "实盘"}</div>
      <div>方向/方式</div><div>${dirLabel(t.direction)} · ${entryLabel[t.entry_type] || t.entry_type}</div>
      <div>状态</div><div>${stateLabel[t.state] || t.state} ${esc(t.close_reason)}</div>
      <div>仓位</div><div>${posU(t)} USDT（${num(t.filled_contracts || t.contracts, 2)} 张 × 每张 ${t.ct_val}）</div>
      <div>计划入场</div><div>${num(t.planned_entry, 2)}</div>
      <div>成交均价</div><div>${num(t.avg_entry, 2)} → ${num(t.avg_exit, 2)}</div>
      <div>止损 / 止盈</div><div>${num(t.stop_loss, 2)} / ${num(t.tp1, 2)}${t.tp2 ? " / " + num(t.tp2, 2) : ""}</div>
      <div>计划风险</div><div>${num(t.risk_amount)} USDT（开仓时权益 ${num(t.equity_at_entry)}）</div>
      <div>净盈亏</div><div>${signed(t.net_pnl)} USDT（平仓盈亏 ${num(t.realized_pnl)}，手续费 ${num(t.fee)}，资金费 ${num(t.funding_fee)}）</div>
      <div>时间</div><div>${ts(t.created_ms)} 下单 · ${ts(t.opened_ms)} 成交 · ${ts(t.closed_ms)} 结束</div>

    <h3>执行记录</h3>
    <ul class="list events">${events.slice().reverse().map((e) => `<li><span class="muted">${ts(e.ts_ms)}</span> ${esc(e.message)}</li>`).join("")}</ul>`;

}

async function openSignal(id) {
  const sig = await api(`/api/signals/${id}`);
  $("sheet").innerHTML = `<h2 style="display:flex;justify-content:space-between">信号 #${sig.id} <button onclick="closeDrawer()">关闭</button></h2>${signalSection(sig)}`;
  $("drawer").classList.add("open");
}

function closeDrawer() { $("drawer").classList.remove("open"); }
$("drawer").onclick = (e) => { if (e.target.id === "drawer") closeDrawer(); };
document.addEventListener("keydown", (e) => { if (e.key === "Escape") closeDrawer(); });

$("killBtn").onclick = async () => {

  if (!on && !window.confirm("确定紧急停止？会撤销所有挂单并市价平掉所有由系统管理的仓位。")) return;
  await api(on ? "/api/resume" : "/api/kill", { method: "POST" });
  refresh();
};
$("range").value = store.get("range", "0");
$("range").onchange = () => { store.set("range", $("range").value); refreshStats(); };
$("version").onchange = () => {
  versionPicked = true;
  resetPager("trades"); resetPager("sig");
  refreshStats(); loadTrades().catch(() => {}); loadSignals().catch(() => {});
};
$("tradeState").onchange = () => { resetPager("trades"); loadTrades().catch(() => {}); };
$("sigOrdersOnly").onchange = () => { resetPager("sig"); loadSignals().catch(() => {}); };
function refreshStats() {
  loadOverview().catch(() => {}); loadEquity().catch(() => {});
  loadPnlChart().catch(() => {}); loadQuality().catch(() => {});

// ── 分析设置 ──
let runnerCfg = null, runDirty = false;
$("runSymbols").oninput = () => { runDirty = true; };
$("runTf").onchange = () => { runDirty = true; };

async function loadRunner() {
  const r = await api("/api/runner");
  runnerCfg = r;
  if (!$("runTf").options.length) $("runTf").innerHTML = r.timeframes.map((t) => `<option value="${t}">${t}</option>`).join("");
  const cfg = r.config || r.active;
  if (cfg && !runDirty && document.activeElement !== $("runSymbols")) {
    $("runSymbols").value = cfg.symbols.join(", ");
    $("runTf").value = cfg.timeframe;
  }
  const a = r.active;
  let msg;
  if (!a) msg = "后台分析没有在运行（需要用 headless --trade 启动）" +
    (r.config ? `，启动后按已保存的 ${r.config.symbols.join(", ")} · ${r.config.timeframe} 运行` : "");
  else {
    msg = `${r.running ? "运行中" : "已停止（2 分钟内无心跳）"}：${a.symbols.join(", ") || "无可用品种"} · ${a.timeframe}`;
    const c = r.config;
    if (c && r.running && (c.timeframe !== a.timeframe || c.symbols.join() !== a.symbols.join()))
      msg += `　→ 已保存 ${c.symbols.join(", ")} · ${c.timeframe}，等待后台切换（约 10 秒）`;
  }
  $("runStatus").textContent = msg;
}

$("runSave").onclick = async () => {
  const symbols = $("runSymbols").value, timeframe = $("runTf").value;
  $("runSave").disabled = true;
  try {
    const headers = { "Content-Type": "application/json", ...(TOKEN ? { Authorization: "Bearer " + TOKEN } : {}) };
    const r = await fetch("/api/runner", { method: "POST", headers, body: JSON.stringify({ symbols, timeframe }) });
    const body = await r.json().catch(() => ({}));
    if (!r.ok) { $("runStatus").textContent = "保存失败：" + (body.detail || r.status); return; }
    runDirty = false;
    await loadRunner();
    klineOptions([...body.config.symbols]);
    $("klineTf").value = body.config.timeframe;
    loadKline().catch(() => {});
  } finally { $("runSave").disabled = false; }
};

// ── K线：OKX 实时 K 线 + 本系统交易的入场/出场标记和当前挂单/持仓的价位线 ──
const TZ_SHIFT = -new Date().getTimezoneOffset() * 60;  // 图表按 UTC 画，平移到本地时间
let kChart, kSeries, kLines = [], kKey = "";

function klineOptions(insts) {
  const sel = $("klineInst"), cur = sel.value;
  const list = [...new Set(insts)].filter(Boolean);
  if (!list.length) list.push("BTC-USDT-SWAP");
  if (sel.options.length === list.length && [...sel.options].every((o, i) => o.value === list[i])) return;
  sel.innerHTML = list.map((i) => `<option value="${esc(i)}">${esc(i.replace("-SWAP", ""))}</option>`).join("");
  sel.value = list.includes(cur) ? cur : list[0];
}

function ensureKChart() {
  if (kChart || !window.LightweightCharts) return !!kChart;
  const el = $("kline");
  kChart = LightweightCharts.createChart(el, {
    autoSize: true,
    layout: { background: { color: css("--panel") }, textColor: css("--muted") },
    grid: { vertLines: { color: css("--line") }, horzLines: { color: css("--line") } },
    timeScale: { timeVisible: true, secondsVisible: false, borderColor: css("--line") },
    rightPriceScale: { borderColor: css("--line") },
    crosshair: { mode: 0 },
  });
  kSeries = kChart.addCandlestickSeries({
    upColor: css("--up"), downColor: css("--down"), borderVisible: false,
    wickUpColor: css("--up"), wickDownColor: css("--down"),
  });
  return true;
}

// 标记必须落在某根 K 线的时间上：取不晚于该时刻的最后一根
function barTime(bars, ms) {
  if (!ms || !bars.length || ms < bars[0].t) return null;
  let lo = 0, hi = bars.length - 1;
  while (lo < hi) { const mid = (lo + hi + 1) >> 1; if (bars[mid].t <= ms) lo = mid; else hi = mid - 1; }
  return bars[lo].t / 1000 + TZ_SHIFT;
}

async function loadKline() {
  if (!ensureKChart()) { $("klineInfo").textContent = "图表库加载失败"; return; }
  const inst = $("klineInst").value, tf = $("klineTf").value;
  if (!inst) return;
  const d = await api(`/api/candles?inst_id=${encodeURIComponent(inst)}&timeframe=${tf}&limit=300`);
  const bars = d.bars;
  kSeries.setData(bars.map((b) => ({ time: b.t / 1000 + TZ_SHIFT, open: b.o, high: b.h, low: b.l, close: b.c })));
  if (kKey !== inst + tf) { kChart.timeScale().fitContent(); kKey = inst + tf; }

  const markers = [];
  const showCanceled = $("klineCanceled").checked;
  for (const t of d.trades) {
    const long = t.direction === "long";
    const tIn = barTime(bars, t.opened_ms);
    if (tIn != null) markers.push({ time: tIn, position: long ? "belowBar" : "aboveBar", shape: long ? "arrowUp" : "arrowDown",
      color: long ? css("--up") : css("--down"), text: `#${t.id}${long ? "多" : "空"}` });
    else if (!t.opened_ms && (t.state === "pending" || showCanceled)) {
      const tPlaced = barTime(bars, t.created_ms);
      if (tPlaced != null) markers.push({ time: tPlaced, position: long ? "belowBar" : "aboveBar", shape: "circle",
        color: css("--muted"), text: `#${t.id}${t.state === "pending" ? "挂单" : "撤"}` });
    }
    const tOut = t.state === "closed" ? barTime(bars, t.closed_ms) : null;
    const R = t.net_pnl != null && t.risk_amount ? t.net_pnl / t.risk_amount : null;
    if (tOut != null) markers.push({ time: tOut, position: long ? "aboveBar" : "belowBar", shape: "square",
      color: (t.net_pnl ?? 0) >= 0 ? css("--up") : css("--down"),
      text: R != null ? `#${t.id} ${R > 0 ? "+" : ""}${R.toFixed(1)}R` : `#${t.id}平` });
  }
  markers.sort((a, b) => a.time - b.time);
  kSeries.setMarkers(markers);

  kLines.forEach((l) => kSeries.removePriceLine(l));
  kLines = [];
  const active = d.trades.filter((t) => t.state === "pending" || t.state === "open");
  for (const t of active) {
    const tag = active.length > 1 ? `#${t.id} ` : "";
    const add = (price, color, title, style = 2) => price && kLines.push(kSeries.createPriceLine(
      { price, color, title: tag + title, lineWidth: 1, lineStyle: style, axisLabelVisible: true }));
    add(t.avg_entry || t.planned_entry, css("--accent"), t.state === "open" ? "持仓" : "挂单", 0);
    add(t.stop_loss, css("--down"), "止损");
    add(t.tp1, css("--up"), "TP1");
    add(t.tp2, css("--up"), "TP2");
  }
  const last = bars[bars.length - 1];
  $("klineInfo").textContent = last ? `OKX 实盘行情 · 最新 ${num(last.c, 1)} · ${active.length} 笔活跃交易` : "";
}

$("klineInst").onchange = () => loadKline().catch(() => {});
$("klineTf").onchange = () => loadKline().catch(() => {});
$("klineCanceled").onchange = () => loadKline().catch(() => {});

async function refresh() {
  try {
    await Promise.all([loadInstFilter(), loadVersions()]);
    const [sigs] = await Promise.all([api("/api/signals?limit=50"), loadOverview(), loadEquity(), loadTrades(),
      loadPnlChart(), loadQuality(), loadSignals(), loadEvents(), loadRunner()]);
    const runCfg = runnerCfg && (runnerCfg.config || runnerCfg.active);
    if (!$("klineInst").options.length) $("klineTf").value = runCfg?.timeframe || sigs[0]?.timeframe || "1h";
    klineOptions([...(runCfg?.symbols || []), ...sigs.map((s) => s.symbol)]);
    await loadKline().catch((err) => { $("klineInfo").textContent = "K线加载失败：" + err.message; });
  } catch (err) {
    $("hb").className = "badge bad";
    $("hb").textContent = String(err).includes("401") ? "需要 token：在网址后加 ?token=…" : "面板连接失败";
  }
}
refresh();
setInterval(refresh, 15000);
